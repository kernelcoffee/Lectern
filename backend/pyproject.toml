[project]
name = "lectern"
version = "0.2.0"
description = "Web-based modded Minecraft server manager"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10",
    "psutil>=5.9",
    "pydantic-settings>=2.4",
    # FastAPI multipart form parsing (resource-pack upload, M7).
    "python-multipart>=0.0.9",
    # Crop/scale player faces from Mojang skins (self-hosted avatars).
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lectern"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Sharing a pytest fixture across modules imports it (F401, noqa'd) and then
# takes it as a same-named parameter, which ruff reads as a redefinition (F811).
"tests/**" = ["F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that start real processes or hit the network",
]
